name: release
# A pushed tag `v<upstream>-mirror-<n>` (AGENTS.md › Versioning) makes the
# release from the tag's CHANGELOG.md section and attaches each platform's
# binary and app bundle. Run it by hand to rebuild an existing tag's assets.
on:
  push:
    tags: ["v*-mirror-*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v1.3.1-mirror-1)"
        required: true
        type: string
permissions:
  contents: write
env:
  TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="${TAG#v}" '
            /^## / { if (inside) exit; inside = index($0, "[" v "]") > 0; next }
            inside { print }
          ' CHANGELOG.md > notes.md
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
  build:
    needs: create
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      # The TUI plugin's binary (herdr/install.sh) and the app bundle (the
      # root install.sh).
      - run: |
          cp target/${{ matrix.target }}/release/herdr-nvim herdr-nvim-${{ matrix.target }}
          herdr-app/bundle.sh target/${{ matrix.target }}/release/herdr-nvim ${{ matrix.target }} .
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" --clobber \
            herdr-nvim-${{ matrix.target }} \
            herdr-nvim-app-${{ matrix.target }}.tar.gz \
            herdr-nvim-app-${{ matrix.target }}.tar.gz.sha256
